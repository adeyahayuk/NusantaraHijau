<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="reefGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <!-- Background Ocean -->
  <rect width="600" height="360" fill="url(#oceanGrad)"/>
  
  <!-- Sun Rays in Water -->
  <polygon points="150,0 220,0 350,360 200,360" fill="#ffffff" opacity="0.08"/>
  <polygon points="300,0 380,0 520,360 380,360" fill="#ffffff" opacity="0.06"/>
  
  <!-- Spider Web Reef Frame (Hexagonal Metal Grid) -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.85">
    <!-- Center Hexagon -->
    <polygon points="300,160 350,190 350,250 300,280 250,250 250,190" stroke-width="3"/>
    <!-- Outer Legs -->
    <line x1="300" y1="160" x2="300" y2="100"/>
    <line x1="350" y1="190" x2="410" y2="150"/>
    <line x1="350" y1="250" x2="410" y2="290"/>
    <line x1="300" y1="280" x2="300" y2="330"/>
    <line x1="250" y1="250" x2="190" y2="290"/>
    <line x1="250" y1="190" x2="190" y2="150"/>
    <!-- Concentric Web Lines -->
    <polygon points="300,180 330,200 330,240 300,260 270,240 270,200"/>
  </g>

  <!-- Coral Fragments (Acropora) -->
  <circle cx="300" cy="160" r="12" fill="url(#reefGrad)"/>
  <circle cx="350" cy="190" r="10" fill="url(#reefGrad)"/>
  <circle cx="350" cy="250" r="14" fill="url(#reefGrad)"/>
  <circle cx="300" cy="280" r="11" fill="url(#reefGrad)"/>
  <circle cx="250" cy="250" r="13" fill="url(#reefGrad)"/>
  <circle cx="250" cy="190" r="9" fill="url(#reefGrad)"/>

  <!-- Diver Silhouette -->
  <g fill="#0f172a" opacity="0.75" transform="translate(110, 60) scale(0.7)">
    <ellipse cx="60" cy="40" rx="30" ry="14" transform="rotate(-15, 60, 40)"/>
    <circle cx="35" cy="35" r="10"/> <!-- Mask -->
    <rect x="75" y="25" width="22" height="12" rx="4" fill="#38bdf8"/> <!-- Scuba Tank -->
    <polygon points="90,45 130,55 120,65 85,50"/> <!-- Leg & Fin -->
    <polygon points="85,35 125,30 115,20 80,30"/> <!-- Leg & Fin -->
  </g>

  <!-- Fish Silhouettes -->
  <path d="M440,110 Q455,105 470,110 L480,103 L477,112 L480,117 L470,113 Z" fill="#38bdf8" opacity="0.6"/>
  <path d="M465,128 Q480,123 495,128 L505,121 L502,130 L505,135 L495,131 Z" fill="#38bdf8" opacity="0.5"/>

  <!-- Bottom Sand -->
  <path d="M0,320 Q200,300 400,325 Q500,335 600,310 L600,360 L0,360 Z" fill="#082f49"/>
</svg>
